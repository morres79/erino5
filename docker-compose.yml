services:
  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile

    ports:
      - "127.0.0.1:8080:80"
      - "[::1]:8080:80"

    volumes:
      - type: bind
        source: .
        target: /var/www/html

      - type: bind
        source: ../.private/database.php
        target: /run/secrets/erino5_database.php
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./.docker/local-apache.conf
        target: /etc/apache2/conf-enabled/zz-erino5-local.conf
        read_only: true

    environment:
      ERINO_CONFIG: /run/secrets/erino5_database.php

    restart: unless-stopped